[package]
name = "rscontacts"
version = "0.2.6"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Managed your google contacts"
license = "MIT"
repository = "https://github.com/veltzer/rscontacts"

[dependencies]
google-people1 = "7"
yup-oauth2 = "12"
hyper = "1"
hyper-rustls = "0.27"
hyper-util = { version = "0.1", features = ["client-legacy", "http2"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6"
open = "5"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustyline = { version = "18", features = ["derive"] }
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = "0.4"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
